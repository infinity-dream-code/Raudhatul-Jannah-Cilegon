<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a15" />
    <link rel="icon" href="../logo/logo.jpeg" type="image/jpeg" />
    <meta name="description" content="Login petugas kantin Facepay Cilegon Raudhatul Jannah" />
    <title>Masuk Kantin — Facepay Cilegon Raudhatul Jannah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/kantin.css" />
  </head>
  <body class="auth-page">
    <div class="portal-bg" aria-hidden="true"></div>
    <main class="auth">
      <section class="auth-card">
        <div class="auth-card__brand">
          <img class="auth-card__logo" src="../logo/logo.jpeg" alt="Logo Raudhatul Jannah" width="44" height="44" />
          <div>
            <h1 class="auth-card__title">Masuk Kantin</h1>
            <p class="auth-card__sub">Facepay Cilegon Raudhatul Jannah</p>
          </div>
        </div>

        <p id="kantin-login-error" class="auth-error" role="alert" hidden></p>

        <form id="kantin-login-form" class="auth-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="kantin-username">Username</label>
            <input
              id="kantin-username"
              name="username"
              type="text"
              class="auth-input"
              autocomplete="username"
              placeholder="Username kantin"
              required
            />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="kantin-password">Kata sandi</label>
            <input
              id="kantin-password"
              name="password"
              type="password"
              class="auth-input"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="btn btn--brand auth-submit" id="kantin-login-submit">
            Masuk
          </button>
        </form>

        <p class="auth-alt">
          <a href="../admin/index.html">Buka Admin →</a>
        </p>
        <p class="auth-alt auth-alt--muted">
          <a href="../index.html">← Kembali ke portal</a>
        </p>
      </section>
    </main>

    <script src="js/kantin-auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.KantinAuth) {
          window.KantinAuth.initLoginPage();
        }
      });
    </script>
  </body>
</html>
