<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <title>Saldo siswa — Facepay Cilegon Raudhatul Jannah</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" href="../../logo/logo.jpeg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="../../logo/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-app-root=".." data-nav="saldo">
    <header class="top-bar">
      <div class="top-bar__inner">
        <a class="top-bar__brand" href="../index.html">
          <img class="top-bar__mark" src="../../logo/logo.jpeg" alt="" width="32" height="32" />
          Facepay Cilegon Raudhatul Jannah
        </a>
      </div>
    </header>

    <main class="page page--prod">
      <header class="page-head">
        <h1>Saldo siswa</h1>
        <p>Pantau saldo siswa. Perbarui per baris bila perlu.</p>
      </header>

      <div class="prod-actions">
        <a class="btn btn--primary" href="../modules/cek-saldo.html">Cek saldo lewat wajah</a>
      </div>

      <div id="saldo-root">
        <div class="saldo-siswa__toolbar">
          <label class="saldo-siswa__per" for="saldo-page-size"
            >Baris
            <select id="saldo-page-size" class="settings-form__input siswa-toolbar__select">
              <option value="5">5</option>
              <option value="8" selected>8</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </label>
        </div>
        <div id="saldo-filter"></div>
        <div class="module-shell siswa-search-panel saldo-search-panel">
          <label class="settings-form__label" for="saldo-search">Cari siswa</label>
          <input
            type="search"
            id="saldo-search"
            class="settings-form__input siswa-search-input"
            placeholder="Nama atau NIS…"
            autocomplete="off"
          />
          <p id="saldo-search-meta" class="siswa-search-meta"></p>
        </div>
        <p class="saldo-siswa__note" id="saldo-status" role="status"></p>
        <div class="table-wrap module-shell">
          <table class="data-table" id="saldo-table">
            <thead>
              <tr>
                <th scope="col">Nama</th>
                <th scope="col">NIS</th>
                <th scope="col">Saldo</th>
                <th scope="col">Aksi</th>
              </tr>
            </thead>
            <tbody id="saldo-body"></tbody>
          </table>
        </div>
        <div id="saldo-pagination" class="siswa-pagination saldo-pagination" hidden></div>
      </div>
    </main>

    <nav id="admin-bottom-nav" class="bottom-nav" aria-label="Menu utama"></nav>

    <script src="../api/config.js"></script>
    <script src="../api/http.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../api/siswa.js"></script>
    <script src="../api/saldo.js"></script>
    <script src="../api/presensi-api.js"></script>
    <script src="../api/index.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/presensi-data-service.js"></script>
    <script src="../js/siswa-filter.js"></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/settings-table.js" defer></script>
    <script src="../js/saldo-siswa.js" defer></script>
  </body>
</html>
