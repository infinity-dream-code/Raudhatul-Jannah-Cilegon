<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <title>Cek saldo wajah — Facepay Cilegon Raudhatul Jannah</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" href="../../logo/logo.jpeg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-app-root=".." data-nav="saldo">
    <header class="top-bar">
      <div class="top-bar__inner">
        <a class="top-bar__brand" href="../index.html">
          <img class="top-bar__mark" src="../../logo/logo.jpeg" alt="" width="32" height="32" />
          Facepay Cilegon Raudhatul Jannah
        </a>
      </div>
    </header>

    <main class="page page--prod">
      <a class="back-link" href="../settings/saldo-siswa.html">← Kembali ke saldo</a>
      <header class="page-head">
        <h1>Cek saldo lewat wajah</h1>
        <p>Hadapkan wajah siswa. Nama dan saldo akan ditampilkan.</p>
      </header>

      <div id="cek-saldo-status" class="face-status" role="status">Menyiapkan…</div>
      <div class="face-detector__toolbar">
        <button type="button" class="btn btn--primary" id="cek-saldo-start">Aktifkan kamera</button>
        <button type="button" class="btn btn--ghost" id="cek-saldo-stop" hidden>Hentikan</button>
        <button type="button" class="btn btn--ghost" id="cek-saldo-flip" hidden title="Tukar kamera depan / belakang">Ganti kamera</button>
        <button type="button" class="btn btn--ghost" id="cek-saldo-reload">Muat ulang wajah</button>
      </div>

      <div class="rfid-video-wrap face-video-wrap" id="cek-saldo-wrap">
        <video id="cek-saldo-video" class="rfid-video" playsinline autoplay muted></video>
        <div class="face-overlay" aria-hidden="true">
          <div id="cek-saldo-box" class="face-target-box" hidden>
            <span id="cek-saldo-label" class="face-target-label" hidden></span>
          </div>
        </div>
      </div>
    </main>

    <div id="cek-saldo-modal" class="modal" aria-hidden="true">
      <div class="modal__backdrop" data-cek-close tabindex="-1"></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="cek-saldo-modal-title">
        <div class="modal__header">
          <h3 id="cek-saldo-modal-title" class="modal__title">Saldo siswa</h3>
          <button type="button" class="modal__close btn btn--ghost" data-cek-close aria-label="Tutup">×</button>
        </div>
        <div class="modal__body">
          <dl class="cek-saldo-dl">
            <div><dt>Nama</dt><dd id="cek-saldo-nama">—</dd></div>
            <div><dt>NIS</dt><dd id="cek-saldo-nis">—</dd></div>
            <div><dt>Saldo</dt><dd id="cek-saldo-nilai">—</dd></div>
          </dl>
          <p id="cek-saldo-err" class="admin-login__error" hidden></p>
        </div>
        <div class="modal__footer" style="padding: 0 1.25rem 1.25rem; display: flex; justify-content: flex-end">
          <button type="button" class="btn btn--primary" data-cek-close>Tutup</button>
        </div>
      </div>
    </div>

    <nav id="admin-bottom-nav" class="bottom-nav" aria-label="Menu utama"></nav>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="../api/config.js"></script>
    <script src="../api/http.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../api/siswa.js"></script>
    <script src="../api/presensi-api.js"></script>
    <script src="../api/index.js"></script>
    <script src="../js/presensi-camera.js"></script>
    <script src="../js/rekam-service.js"></script>
    <script src="../js/cek-saldo-wajah.js" defer></script>
  </body>
</html>
