<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <title>Uji wajah — Facepay Cilegon Raudhatul Jannah</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" href="../../logo/logo.jpeg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="../../logo/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-app-root=".." data-nav="uji">
    <header class="top-bar">
      <div class="top-bar__inner">
        <a class="top-bar__brand" href="../index.html">
          <img class="top-bar__mark" src="../../logo/logo.jpeg" alt="" width="32" height="32" />
          Facepay Cilegon Raudhatul Jannah
        </a>
      </div>
    </header>

    <main class="page page--prod">
      <header class="page-head">
        <h1>Uji wajah</h1>
        <p>Tes pengenalan wajah terhadap foto yang sudah direkam.</p>
      </header>

      <div id="face-root" class="face-detector">
        <div class="presensi-desktop-grid">
          <div class="presensi-desktop-main">
            <div id="face-status" class="face-status" role="status" aria-live="polite">Menyiapkan…</div>

            <div class="face-detector__toolbar">
              <button type="button" class="btn btn--primary" id="face-btn-start">Aktifkan kamera</button>
              <button type="button" class="btn btn--ghost" id="face-btn-stop" hidden>Hentikan</button>
              <button type="button" class="btn btn--ghost" id="face-btn-flip" hidden title="Tukar kamera depan / belakang">Ganti kamera</button>
              <button type="button" class="btn btn--ghost" id="face-btn-reload">Muat ulang data wajah</button>
            </div>

            <section class="module-shell face-detector__cam">
              <p id="face-hint" class="face-detector__hint">Hadapkan wajah ke kamera setelah model siap.</p>
              <div id="face-video-wrap" class="rfid-video-wrap face-video-wrap">
                <video id="face-video" class="rfid-video" playsinline autoplay muted></video>
                <div id="face-overlay" class="face-overlay" aria-hidden="true">
                  <div id="face-target-box" class="face-target-box" hidden>
                    <span id="face-target-label" class="face-target-label" hidden></span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          <aside class="presensi-desktop-side" aria-label="Log uji">
            <section class="module-shell face-log">
              <div class="data-settings__table-head">
                <h3 class="data-settings__h3 face-log__heading" id="face-log-heading">Hasil uji</h3>
                <p id="face-log-meta" class="face-log__meta">Belum ada deteksi.</p>
              </div>
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th scope="col">Nama</th>
                      <th scope="col">Pertama</th>
                      <th scope="col">Terakhir</th>
                    </tr>
                  </thead>
                  <tbody id="face-log-body">
                    <tr>
                      <td class="data-table__empty" colspan="3">Belum ada data.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </aside>
        </div>
      </div>
    </main>

    <nav id="admin-bottom-nav" class="bottom-nav" aria-label="Menu utama"></nav>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="../api/config.js"></script>
    <script src="../api/http.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../api/siswa.js"></script>
    <script src="../api/saldo.js"></script>
    <script src="../api/presensi-api.js"></script>
    <script src="../api/index.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/presensi-data-service.js"></script>
    <script src="../js/presensi-masuk-modal.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/presensi-camera.js" defer></script>
    <script src="../js/rekam-service.js"></script>
    <script src="../js/face-detector.js" defer></script>
  </body>
</html>
