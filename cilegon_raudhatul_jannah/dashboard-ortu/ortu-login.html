<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14855f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Login Orang Tua — Cilegon Raudhatul Jannah</title>
  <link rel="icon" type="image/jpeg" href="assets/logo/logo.jpeg">
  <link rel="stylesheet" href="css/ortu-style.css">
</head>
<body class="ortu-app ortu-app--login">
  <div class="ortu-frame ortu-frame--login">
    <div class="ortu-login-wrap">
      <div class="ortu-login-card">
        <div class="ortu-login-brand">
          <img src="assets/logo/logo.jpeg" alt="Cilegon Raudhatul Jannah" width="64" height="64">
          <h1>Dashboard Orang Tua</h1>
          <p>Pondok Pesantren Cilegon Raudhatul Jannah</p>
        </div>

        <div id="ortuLoginError" class="ortu-error" role="alert"></div>

        <form id="ortuLoginForm" novalidate>
          <div class="ortu-form-group">
            <label for="ortuUsername">Username</label>
            <input type="text" id="ortuUsername" class="ortu-input" placeholder="Contoh: 1301154344" autocomplete="username" inputmode="numeric" required>
          </div>
          <div class="ortu-form-group">
            <label for="ortuPassword">Password</label>
            <input type="password" id="ortuPassword" class="ortu-input" placeholder="Password akun orang tua" autocomplete="current-password" required>
          </div>
          <button type="submit" class="ortu-btn ortu-btn--primary">Masuk</button>
        </form>

        <div class="ortu-hint">
          Login terhubung ke <strong>Smart Payment</strong>.<br>
          Gunakan username dan password yang diberikan sekolah.
        </div>
      </div>
    </div>
  </div>

  <script src="js/ortu-config.js"></script>
  <script src="js/ortu-api.js"></script>
  <script src="js/ortu-accounts.js"></script>
  <script src="js/ortu-auth.js"></script>
  <script src="js/pages/ortu-login-page.js"></script>
  <script>OrtuLoginPage.init();</script>
</body>
</html>
