<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14855f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Keuangan — Dashboard Orang Tua Cilegon Raudhatul Jannah</title>
  <link rel="icon" type="image/jpeg" href="assets/logo/logo.jpeg">
  <link rel="stylesheet" href="css/ortu-style.css">
</head>
<body class="ortu-app">
  <div class="ortu-frame">
    <header class="ortu-topbar">
      <div class="ortu-topbar__brand">
        <img src="assets/logo/logo.jpeg" alt="" width="32" height="32">
        <span>Cilegon Raudhatul Jannah</span>
      </div>
      <button type="button" class="ortu-topbar__logout" id="ortuBtnLogout" aria-label="Keluar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </header>

    <main class="ortu-main">
      <div class="ortu-keu-grid">
        <a href="ortu-tagihan.html" class="ortu-keu-card ortu-keu-card--tagihan" id="btnLihatTagihan">
          <span class="ortu-keu-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </span>
          Lihat Tagihan
        </a>
        <a href="ortu-pembayaran.html" class="ortu-keu-card ortu-keu-card--bayar" id="btnPembayaran">
          <span class="ortu-keu-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
            </svg>
          </span>
          Pembayaran
        </a>
        <a href="ortu-transaksi.html" class="ortu-keu-card ortu-keu-card--transaksi" id="btnLihatTransaksi">
          <span class="ortu-keu-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </span>
          Lihat Transaksi
        </a>
        <a href="ortu-transaksi-kantin.html" class="ortu-keu-card ortu-keu-card--kantin" id="btnTransaksiKantin">
          <span class="ortu-keu-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          </span>
          Transaksi Kantin
        </a>
      </div>
      <p style="font-size:0.78rem;color:var(--ortu-text-muted);text-align:center;margin-top:0.5rem;">
        Siswa: <strong id="keuNama">—</strong> · NIS <strong id="keuNis">—</strong>
      </p>
    </main>

    <nav class="ortu-bottom-nav" aria-label="Navigasi utama">
      <div class="ortu-bottom-nav__inner">
        <a href="ortu-profil.html" class="ortu-nav-item" data-tab="profil">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil
        </a>
        <a href="ortu-keuangan.html" class="ortu-nav-item is-active" data-tab="keuangan">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          Keuangan
        </a>
      </div>
    </nav>
  </div>

  <script src="js/ortu-auth.js"></script>
  <script src="js/ortu-shell.js"></script>
  <script>
    (function () {
      if (!OrtuAuth.requireAuth('ortu-login.html')) return;
      var s = OrtuAuth.getSession();
      document.getElementById('keuNama').textContent = s.nama || '—';
      document.getElementById('keuNis').textContent = s.nis || '—';
      OrtuShell.setupLogout('ortuBtnLogout');
      OrtuShell.markNavActive('keuangan');
    })();
  </script>
</body>
</html>
