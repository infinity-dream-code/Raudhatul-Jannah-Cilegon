<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14855f">
  <title>Transaksi Kantin — Dashboard Orang Tua Cilegon Raudhatul Jannah</title>
  <link rel="icon" type="image/jpeg" href="assets/logo/logo.jpeg">
  <link rel="stylesheet" href="css/ortu-style.css">
</head>
<body class="ortu-app">
  <div class="ortu-frame">
    <header class="ortu-subtop">
      <a href="ortu-keuangan.html" class="ortu-subtop__back" data-ortu-back aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="ortu-subtop__title">Transaksi Kantin</h1>
    </header>

    <main class="ortu-main ortu-main--sub">
      <div class="ortu-keu-summary ortu-keu-summary--kantin">
        <div class="ortu-keu-summary__label">Jumlah Transaksi Kantin</div>
        <div class="ortu-keu-summary__value" id="txKantinCount">—</div>
        <div class="ortu-keu-summary__range" id="txKantinRange">—</div>
      </div>

      <form class="ortu-tx-filter" id="txKantinFilterForm">
        <div class="ortu-tx-filter__row">
          <div class="ortu-form-group ortu-tx-filter__field">
            <label for="txKantinDateFrom">Dari tanggal</label>
            <input type="date" id="txKantinDateFrom" class="ortu-input">
          </div>
          <div class="ortu-form-group ortu-tx-filter__field">
            <label for="txKantinDateTo">Sampai tanggal</label>
            <input type="date" id="txKantinDateTo" class="ortu-input">
          </div>
        </div>
        <div class="ortu-tx-filter__actions">
          <button type="submit" class="ortu-btn ortu-btn--primary ortu-btn--sm">Terapkan</button>
          <button type="button" class="ortu-btn ortu-btn--secondary ortu-btn--sm" id="txKantinFilterReset">Reset</button>
        </div>
      </form>

      <div id="txKantinList"></div>
    </main>

    <nav class="ortu-bottom-nav" aria-label="Navigasi utama">
      <div class="ortu-bottom-nav__inner">
        <a href="ortu-profil.html" class="ortu-nav-item" data-tab="profil">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil
        </a>
        <a href="ortu-keuangan.html" class="ortu-nav-item is-active" data-tab="keuangan">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          Keuangan
        </a>
      </div>
    </nav>
  </div>

  <script src="js/ortu-config.js"></script>
  <script src="js/ortu-api.js"></script>
  <script src="js/ortu-auth.js"></script>
  <script src="js/ortu-keu.js"></script>
  <script src="js/ortu-shell.js"></script>
  <script src="js/pages/ortu-transaksi-kantin-page.js"></script>
  <script>OrtuTransaksiKantinPage.init();</script>
</body>
</html>
