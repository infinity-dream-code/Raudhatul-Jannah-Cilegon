<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14855f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Profil — Dashboard Orang Tua Cilegon Raudhatul Jannah</title>
  <link rel="icon" type="image/jpeg" href="assets/logo/logo.jpeg">
  <link rel="stylesheet" href="css/ortu-style.css">
</head>
<body class="ortu-app">
  <div class="ortu-frame">  
    <header class="ortu-topbar">
      <div class="ortu-topbar__brand">
        <img src="assets/logo/logo.jpeg" alt="" width="32" height="32">
        <span>Cilegon Raudhatul Jannah</span>
      </div>
      <button type="button" class="ortu-topbar__logout" id="ortuBtnLogout" aria-label="Keluar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </header>

    <main class="ortu-main">
      <section class="ortu-hero">
        <div class="ortu-hero__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <div>
          <div class="ortu-hero__nis" id="heroNis">—</div>
          <div class="ortu-hero__name" id="heroNama">—</div>
        </div>
      </section>

      <section class="ortu-card" aria-label="Data siswa">
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">No. VA SPP</div>
            <div class="ortu-row__value" id="valVaSpp">—</div>
          </div>
          <button type="button" class="ortu-copy-btn" id="btnCopyVaSpp" data-ortu-copy="" aria-label="Salin nomor VA SPP">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
        </div>
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">No. VA DU</div>
            <div class="ortu-row__value" id="valVaDu">—</div>
          </div>
          <button type="button" class="ortu-copy-btn" id="btnCopyVaDu" data-ortu-copy="" aria-label="Salin nomor VA DU">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
        </div>
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">Unit / Sekolah</div>
            <div class="ortu-row__value" id="valUnit">—</div>
          </div>
        </div>
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">Kelompok</div>
            <div class="ortu-row__value" id="valJenjang">—</div>
          </div>
        </div>
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">Kelas</div>
            <div class="ortu-row__value" id="valKelas">—</div>
          </div>
        </div>
        <div class="ortu-row">
          <div class="ortu-row__left">
            <div class="ortu-row__label">Saldo SPP</div>
            <div class="ortu-row__value" id="valSaldo">—</div>
          </div>
        </div>
      </section>

      <div class="ortu-actions">
        <button type="button" class="ortu-btn ortu-btn--blue" id="btnGantiPassword">Ganti Password</button>
        <button type="button" class="ortu-btn ortu-btn--green" id="btnMultiAkun">Multi Akun</button>
      </div>
    </main>

    <nav class="ortu-bottom-nav" aria-label="Navigasi utama">
      <div class="ortu-bottom-nav__inner">
        <a href="ortu-profil.html" class="ortu-nav-item is-active" data-tab="profil">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil
        </a>
        <a href="ortu-keuangan.html" class="ortu-nav-item" data-tab="keuangan">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          Keuangan
        </a>
      </div>
    </nav>
  </div>

  <div id="ortuPasswordModal" class="ortu-modal" aria-hidden="true" role="dialog" aria-labelledby="ortuPasswordTitle">
    <div class="ortu-modal__backdrop" data-ortu-modal-close tabindex="-1"></div>
    <div class="ortu-modal__panel">
      <div class="ortu-modal__head">
        <h3 id="ortuPasswordTitle">Ganti Password</h3>
        <button type="button" class="ortu-modal__close" data-ortu-modal-close aria-label="Tutup">×</button>
      </div>
      <div id="ortuPasswordError" class="ortu-form-error" role="alert"></div>
      <form id="ortuPasswordForm">
        <div class="ortu-form-group">
          <label for="ortuCurrentPassword">Password lama</label>
          <input type="password" id="ortuCurrentPassword" class="ortu-input" autocomplete="current-password" required placeholder="Password saat ini">
        </div>
        <div class="ortu-form-group">
          <label for="ortuNewPassword">Password baru</label>
          <input type="password" id="ortuNewPassword" class="ortu-input" autocomplete="new-password" required minlength="3" placeholder="Password baru">
        </div>
        <div class="ortu-form-group">
          <label for="ortuConfirmPassword">Konfirmasi password baru</label>
          <input type="password" id="ortuConfirmPassword" class="ortu-input" autocomplete="new-password" required minlength="3" placeholder="Ulangi password baru">
        </div>
        <div class="ortu-modal__actions">
          <button type="button" class="ortu-btn ortu-btn--secondary" data-ortu-modal-close>Batal</button>
          <button type="submit" class="ortu-btn ortu-btn--primary" id="ortuPasswordSubmit">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/ortu-config.js"></script>
  <script src="js/ortu-api.js"></script>
  <script src="js/ortu-auth.js"></script>
  <script src="js/ortu-accounts.js"></script>
  <script src="js/ortu-shell.js"></script>
  <script src="js/pages/ortu-profil-page.js"></script>
  <script>OrtuProfilPage.init();</script>
</body>
</html>
